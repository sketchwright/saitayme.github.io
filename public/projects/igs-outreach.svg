<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#1b0f08"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f07e41" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f07e41" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f07e41" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <circle cx="820" cy="360" r="300" fill="url(#core)"/>
  <!-- network of creators -->
  <g stroke="#f07e41" stroke-opacity="0.45" stroke-width="2" fill="none">
    <path d="M820 360 L620 170 M820 360 L1040 150 M820 360 L1110 400 M820 360 L980 590 M820 360 L640 560 M820 360 L560 360"/>
    <path d="M620 170 L1040 150 L1110 400 L980 590 L640 560 L560 360 Z" stroke-opacity="0.18" stroke-dasharray="6 10"/>
  </g>
  <g fill="#0a0a0a" stroke="#f07e41" stroke-width="3" filter="url(#glow)">
    <circle cx="620" cy="170" r="26"/><circle cx="1040" cy="150" r="22"/><circle cx="1110" cy="400" r="30"/>
    <circle cx="980" cy="590" r="24"/><circle cx="640" cy="560" r="20"/><circle cx="560" cy="360" r="18"/>
  </g>
  <g fill="#f07e41">
    <circle cx="620" cy="170" r="8"/><circle cx="1040" cy="150" r="7"/><circle cx="1110" cy="400" r="9"/>
    <circle cx="980" cy="590" r="7"/><circle cx="640" cy="560" r="6"/><circle cx="560" cy="360" r="6"/>
  </g>
  <!-- envelope core -->
  <g filter="url(#glow)">
    <rect x="740" y="305" width="160" height="110" rx="10" fill="#0a0a0a" stroke="#f07e41" stroke-width="5"/>
    <path d="M745 312 L820 372 L895 312" fill="none" stroke="#f07e41" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <!-- stat chips -->
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="20" fill="#f07e41">
    <rect x="655" y="120" width="160" height="34" rx="6" fill="#0a0a0a" stroke="#f07e41" stroke-opacity="0.5"/>
    <text x="668" y="143">TWITCH 5.2K</text>
    <rect x="1000" y="440" width="170" height="34" rx="6" fill="#0a0a0a" stroke="#f07e41" stroke-opacity="0.5"/>
    <text x="1013" y="463">REPLY ✓ +1</text>
    <rect x="660" y="590" width="190" height="34" rx="6" fill="#0a0a0a" stroke="#f07e41" stroke-opacity="0.5"/>
    <text x="673" y="613">YT 48K · CO-OP</text>
  </g>
  <!-- title -->
  <g font-family="Orbitron, Arial Black, sans-serif">
    <text x="70" y="300" font-size="88" font-weight="900" fill="#f07e41" filter="url(#glow)">IGS</text>
    <text x="70" y="390" font-size="64" font-weight="700" fill="#ffffff">OUTREACH</text>
  </g>
  <rect x="72" y="420" width="120" height="5" fill="#f07e41"/>
  <text x="70" y="470" font-family="JetBrains Mono, Consolas, monospace" font-size="22" fill="#9ca3af">find · mail · follow up · measure</text>
</svg>
